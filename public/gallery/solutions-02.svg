<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="900" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="0.5" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="g1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(500 450) scale(700 500)">
      <stop stop-color="#22C55E" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1100 350) scale(800 600)">
      <stop stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heat" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#EF4444" stop-opacity="0.2"/>
    </radialGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#g1)"/>
  <rect width="1600" height="900" fill="url(#g2)"/>

  <!-- Feedstock inputs -->
  <g transform="translate(120 200)">
    <text x="140" y="0" fill="white" fill-opacity="0.5" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">FEEDSTOCK</text>
    <rect x="0" y="20" width="120" height="80" rx="10" fill="#1E293B" stroke="white" stroke-opacity="0.15" stroke-width="1.5"/>
    <text x="60" y="55" fill="white" fill-opacity="0.6" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Plastics</text>
    <text x="60" y="72" fill="white" fill-opacity="0.35" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&amp; rubber</text>
    <rect x="140" y="20" width="120" height="80" rx="10" fill="#1E293B" stroke="white" stroke-opacity="0.15" stroke-width="1.5"/>
    <text x="200" y="55" fill="white" fill-opacity="0.6" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Biomass</text>
    <text x="200" y="72" fill="white" fill-opacity="0.35" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&amp; MSW</text>
    <rect x="70" y="120" width="120" height="80" rx="10" fill="#1E293B" stroke="white" stroke-opacity="0.15" stroke-width="1.5"/>
    <text x="130" y="155" fill="white" fill-opacity="0.6" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Industrial</text>
    <text x="130" y="172" fill="white" fill-opacity="0.35" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">residues</text>
  </g>

  <!-- Reactor vessel -->
  <g transform="translate(480 180)">
    <rect x="0" y="0" width="360" height="420" rx="24" fill="#1E293B" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="2"/>
    <text x="180" y="40" fill="white" fill-opacity="0.7" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Thermochemical Reactor</text>

    <!-- Pyrolysis chamber -->
    <ellipse cx="180" cy="220" rx="120" ry="100" fill="url(#heat)" opacity="0.5"/>
    <ellipse cx="180" cy="220" rx="100" ry="80" stroke="#F59E0B" stroke-opacity="0.5" stroke-width="2" fill="#0F172A" fill-opacity="0.6"/>
    <ellipse cx="180" cy="220" rx="60" ry="45" fill="#EF4444" fill-opacity="0.2" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Temperature indicator -->
    <text x="180" y="228" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">800°C</text>

    <!-- Process labels -->
    <rect x="30" y="340" width="140" height="52" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="100" y="364" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Pyrolysis</text>
    <text x="100" y="380" fill="white" fill-opacity="0.4" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Oxygen-free</text>

    <rect x="190" y="340" width="140" height="52" rx="8" fill="#0F172A" stroke="#22C55E" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="260" y="364" fill="#22C55E" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Gasification</text>
    <text x="260" y="380" fill="white" fill-opacity="0.4" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Controlled O₂</text>
  </g>

  <!-- Output pipes and products -->
  <g transform="translate(920 160)">
    <text x="280" y="0" fill="white" fill-opacity="0.5" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">OUTPUTS</text>

    <!-- Syngas pipe -->
    <path d="M0 120 C80 120, 80 80, 160 80 H400" stroke="url(#pipe)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="400" y="50" width="200" height="60" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="500" y="78" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Syngas</text>
    <text x="500" y="96" fill="white" fill-opacity="0.4" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Synthesis gas</text>

    <!-- Fuel oil pipe -->
    <path d="M0 220 C80 220, 80 180, 160 180 H400" stroke="#F59E0B" stroke-opacity="0.6" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="400" y="150" width="200" height="60" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="500" y="178" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Fuel Oils</text>
    <text x="500" y="196" fill="white" fill-opacity="0.4" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Liquid fractions</text>

    <!-- Carbon pipe -->
    <path d="M0 320 C80 320, 80 280, 160 280 H400" stroke="#22C55E" stroke-opacity="0.5" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="400" y="250" width="200" height="60" rx="10" fill="#0F172A" stroke="#22C55E" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="500" y="278" fill="#22C55E" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Activated Carbon</text>
    <text x="500" y="296" fill="white" fill-opacity="0.4" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Carbon black</text>

    <!-- Char / solid -->
    <rect x="400" y="350" width="200" height="60" rx="10" fill="#0F172A" stroke="white" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="500" y="378" fill="white" fill-opacity="0.6" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Solid Residue</text>
    <text x="500" y="396" fill="white" fill-opacity="0.35" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Inert char</text>
  </g>

  <!-- Flow arrows from feedstock to reactor -->
  <g stroke="white" stroke-opacity="0.25" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M380 340 H470"/>
    <path d="M450 320 L470 340 L450 360" fill="white" fill-opacity="0.25" stroke="none"/>
  </g>

  <!-- Flow arrows from reactor to outputs -->
  <g stroke="white" stroke-opacity="0.25" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M850 300 H910"/>
    <path d="M890 280 L910 300 L890 320" fill="white" fill-opacity="0.25" stroke="none"/>
  </g>

  <!-- Heat waves -->
  <g opacity="0.2" stroke="#F59E0B" stroke-width="2" fill="none">
    <path d="M560 120 Q580 100 600 120 Q620 140 640 120"/>
    <path d="M600 100 Q620 80 640 100 Q660 120 680 100"/>
    <path d="M640 120 Q660 100 680 120 Q700 140 720 120"/>
  </g>
</svg>
