<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(420 280) rotate(20) scale(760 520)">
      <stop stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 240) rotate(-10) scale(900 600)">
      <stop stop-color="#22C55E" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#E2E8F0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#94A3B8" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow1)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <g opacity="0.08">
    <path d="M0 640 C 300 520, 520 520, 820 640 S 1400 820, 1600 690" stroke="white" stroke-width="2" fill="none"/>
    <path d="M0 700 C 320 580, 560 580, 860 700 S 1400 880, 1600 750" stroke="white" stroke-width="2" fill="none"/>
  </g>

  <!-- Power lines -->
  <g stroke="#38BDF8" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M180 420 L420 340"/>
    <path d="M420 340 L680 380"/>
    <path d="M680 380 L920 300"/>
    <path d="M920 300 L1180 360"/>
    <path d="M1180 360 L1420 280"/>
    <path d="M420 340 L420 520"/>
    <path d="M920 300 L920 500"/>
    <path d="M1180 360 L1180 540"/>
  </g>

  <!-- Transmission towers -->
  <g fill="url(#tower)" stroke="#CBD5E1" stroke-opacity="0.4" stroke-width="1.5">
    <path d="M400 620 L440 340 L480 620 Z"/>
    <path d="M410 440 H470"/>
    <path d="M418 500 H462"/>
    <path d="M900 640 L940 300 L980 640 Z"/>
    <path d="M910 400 H970"/>
    <path d="M918 460 H962"/>
    <path d="M1160 660 L1200 360 L1240 660 Z"/>
    <path d="M1170 460 H1230"/>
  </g>

  <!-- Local energy nodes -->
  <g>
    <circle cx="420" cy="340" r="18" fill="url(#node)" fill-opacity="0.85"/>
    <circle cx="420" cy="340" r="32" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="2" fill="none"/>
    <circle cx="920" cy="300" r="18" fill="url(#node)" fill-opacity="0.85"/>
    <circle cx="920" cy="300" r="32" stroke="#22C55E" stroke-opacity="0.35" stroke-width="2" fill="none"/>
    <circle cx="1180" cy="360" r="14" fill="#38BDF8" fill-opacity="0.7"/>
    <circle cx="1180" cy="360" r="26" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="2" fill="none"/>
  </g>

  <!-- Battery / storage unit -->
  <g transform="translate(620 500)">
    <rect x="0" y="0" width="180" height="110" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="20" y="24" width="140" height="18" rx="4" fill="#38BDF8" fill-opacity="0.25"/>
    <rect x="20" y="52" width="110" height="18" rx="4" fill="#22C55E" fill-opacity="0.25"/>
    <rect x="20" y="80" width="80" height="18" rx="4" fill="#38BDF8" fill-opacity="0.18"/>
    <path d="M190 38 H210 V72 H190 Z" fill="#38BDF8" fill-opacity="0.5"/>
  </g>

  <!-- Resilience pulse rings -->
  <g opacity="0.5">
    <circle cx="800" cy="450" r="120" stroke="#22C55E" stroke-opacity="0.2" stroke-width="2" fill="none"/>
    <circle cx="800" cy="450" r="180" stroke="#38BDF8" stroke-opacity="0.12" stroke-width="2" fill="none"/>
  </g>
</svg>
