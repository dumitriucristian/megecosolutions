    <path d="M60 0 L120 24 V72 C120 108 96 138 60 156 C24 138 0 108 0 72 V24 Z" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-opacity="0.5" stroke-width="2"/>
