      <stop stop-color="#020617"/>
      <stop offset="0.6" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 320) rotate(10) scale(980 560)">
      <stop stop-color="#A855F7" stop-opacity="0.22"/>
